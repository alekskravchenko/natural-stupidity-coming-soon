<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f4">
  <meta name="description" content="Natural Stupidity. Something stupid is coming.">
  <title>Natural Stupidity — See you soon.</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="holding.css">
  <script src="holding.js" defer></script>
  <!-- Google Analytics: public domain only; local previews are excluded. -->
  <script>
    if (['naturalstupidity.fun', 'www.naturalstupidity.fun'].includes(window.location.hostname)) {
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-JR7VQTRVSZ');
      var analyticsScript = document.createElement('script');
      analyticsScript.async = true;
      analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-JR7VQTRVSZ';
      document.head.appendChild(analyticsScript);
    }
  </script>
</head>
<body>
  <main class="holding" aria-labelledby="holding-title" data-phase="calm">
    <header class="masthead">
      <a class="logo" href="./" aria-label="Natural Stupidity home">
        <svg class="crown" viewBox="0 0 40 30" aria-hidden="true"><path d="M4 8 8 26 33 26 37 7 26 17 21 3 14 18Z"/></svg>NS
      </a>
      <span class="see-you">See you soon <span aria-hidden="true">↗</span></span>
    </header>
    <div class="composition">
      <div class="intro">
        <h1 id="holding-title"><span>NATURAL</span><span class="marked">STUPIDITY</span></h1>
        <p class="promise">Something stupid is coming.</p>
        <p class="aside">Probably nothing.</p>
      </div>
      <figure class="scene" aria-label="Nat reclines with his feet on the desk, inexplicably confident.">
        <div class="thought" aria-hidden="true">
          <span class="thinking-dot"></span>
          <span class="thought-text">Analyzing market…</span>
          <svg class="thought-tail" viewBox="0 0 50 45"><path d="M8 2 Q5 30 39 36 M28 26 L40 37 L24 39"/></svg>
        </div>
        <div class="nat-reaction">
          <div class="nat-follow">
            <img class="nat" src="nat-meet.png" width="1254" height="1254" alt="" fetchpriority="high" draggable="false">
          </div>
        </div>
        <div class="decision" aria-hidden="true">
          <div class="buy-prop">BUY</div>
          <svg class="impulse-cursor" viewBox="0 0 32 40"><path d="M3 2 L3 29 L10 23 L16 37 L22 34 L16 21 L28 21 Z"/></svg>
          <svg class="click-rays" viewBox="0 0 180 100"><path d="M15 26 L2 14 M24 13 L21 1 M160 25 L178 14 M158 12 L163 1"/></svg>
        </div>
      </figure>
    </div>
    <footer class="colophon">
      <span class="signature">A little less thinking.</span>
      <div class="footer-actions">
        <a class="twitter-link" href="https://x.com/natstupidity_" target="_blank" rel="noopener noreferrer">Follow on X <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
        <button class="motion-control" type="button" aria-pressed="false" aria-label="Pause animation" hidden>
          <svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3V13M11 3V13"/></svg>
          <svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3L12 8L5 13Z"/></svg>
          <span class="motion-label">Pause</span>
        </button>
      </div>
    </footer>
  </main>
</body>
</html>
